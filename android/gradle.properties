org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier rewrites androidx.activity AARs and breaks EdgeToEdge (Unresolved reference).
# No com.android.support libraries remain on the classpath.
android.enableJetifier=false
flutter.embedding.v2=true
# R8-integrated resource shrinking (AGP 8.6+). Default-on in AGP 9.0 when shrinkResources is true.
android.r8.optimizedResourceShrinking=true
