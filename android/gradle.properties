org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier rewrites androidx.activity AARs and breaks EdgeToEdge (Unresolved reference).
# No com.android.support libraries remain on the classpath.
android.enableJetifier=false
flutter.embedding.v2=true

# Flutter + AGP 9 compatibility while plugins/apps finish built-in Kotlin / new DSL migration.
# See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
android.builtInKotlin=false
android.newDsl=false

# Optimized resource shrinking (Play Console R8 recommendation).
# Default-on in AGP 9 when shrinkResources is true; kept explicit for clarity.
android.r8.optimizedResourceShrinking=true
